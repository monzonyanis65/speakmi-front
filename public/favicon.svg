<!--
  EL ICONO DE SPEAKMI

  Qué es: la cara de Milo dibujada DENTRO de un bocadillo de diálogo. Una sola
  silueta que dice las dos cosas que es la aplicación —un personaje, y hablar—
  en vez de elegir una. El anterior era el pájaro entero, y entero no cabe: a
  48 px se veía una mancha blanca con un pico que ya no se distinguía.

  Las cuatro decisiones, que son de tamaño y no de gusto:

  1. SE LEE A 48 px. Es lo que mide de verdad en la pantalla de inicio de un
     teléfono. Por eso hay tres elementos y no diez: dos ojos y un pico. Las
     cejas, el moteado del pecho y las alas de la mascota se quedaron fuera; a
     ese tamaño no son detalle, son suciedad.

  2. BLANCO SOBRE ÍNDIGO, Y EL ÍNDIGO PLANO. Es el contraste más alto que da la
     paleta de la casa y lo que hace que la silueta aguante encima de un fondo
     de pantalla cualquiera. Llevó un degradado y se quitó: a 48 px no se
     distingue de un color liso, y obligaba a que lo que se ve en el teléfono se
     generase de otra manera que lo que se ve en la pestaña del navegador. Un
     icono con dos versiones es un icono que un día dejan de parecerse.

  3. A SANGRE, SIN ESQUINAS REDONDEADAS. Las redondea el sistema, y cada uno a
     su manera —iOS con su cuadrado blando, Android con lo que quiera el
     fabricante—. Redondearlas aquí también deja un borde doble con una cuña de
     fondo asomando por fuera, que es el error clásico.

  4. TODO DENTRO DEL CÍRCULO CENTRAL. Android recorta el icono con la forma que
     le dé la gana, así que nada importante puede salirse del 80 % del centro.
     Por eso el rabito del bocadillo apunta hacia dentro y no hacia la esquina.

  Si se retoca este archivo hay que volver a generar los PNG:
  `python scripts/generar-iconos.py`. Son ellos los que acaban en el teléfono.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#4f46e5" />

  <g id="marca">
    <!--
      El bocadillo y su rabito van en un solo trazado, no en dos figuras
      pegadas: así no puede aparecer nunca la costura entre ambos cuando el
      sistema lo escala a un tamaño raro.
    -->
    <path
      fill="#ffffff"
      d="M160 72h192a84 84 0 0 1 84 84v112a84 84 0 0 1-84 84H236l-78 62a7 7 0 0 1-11.3-6.5l11.2-55.6A84 84 0 0 1 76 268V156a84 84 0 0 1 84-84z"
    />

    <!-- Los ojos, con su brillo. El brillo es lo único que separa una cara
         despierta de dos agujeros, y a 48 px todavía se nota. -->
    <circle cx="196" cy="190" r="34" fill="#312e81" />
    <circle cx="316" cy="190" r="34" fill="#312e81" />
    <circle cx="208" cy="178" r="11" fill="#ffffff" />
    <circle cx="328" cy="178" r="11" fill="#ffffff" />

    <!-- El pico, en el ámbar de la casa. Las puntas redondeadas son lo que lo
         hace hermano de los demás iconos y no un triángulo cualquiera. -->
    <path
      d="M223 248h66l-33 56z"
      fill="#f59e0b"
      stroke="#f59e0b"
      stroke-width="12"
      stroke-linejoin="round"
    />
  </g>
</svg>
